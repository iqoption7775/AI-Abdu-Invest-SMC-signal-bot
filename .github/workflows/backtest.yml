name: Backtest tahlili

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python backtest.py
      - name: Hisobotni saqlash
        run: |
          git config user.name "abdu-invest-bot"
          git config user.email "bot@users.noreply.github.com"
          git add hisobot
          git commit -m "Backtest hisoboti" || exit 0
          git pull --rebase
          git push
